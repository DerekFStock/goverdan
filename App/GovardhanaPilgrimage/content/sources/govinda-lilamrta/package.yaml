    order: 578
    verification_status: VERIFIED
    translation_status: WORKING_PROJECT
    translation_note: Concise existing research-ledger rendering; not a full literal translation or final publication text.
    reading_note: The mūla transcription has kastūryālī; the commentary witness segments kastūry-ālī. The commentary gloss explicitly attributes the instruction to Lalitā and identifies Vṛndā learning the meeting-grove from Subala.
    transliteration: |
      mālām etāṁ tulasi haraye vīṭikāś copahṛtya
      jñātvā vṛndā subala-mukhataḥ keli-saṅketa-kuñjam |
      āgacchatāśu tvam iti lalitā-preritādāya tāntāḥ
      kastūry-ālī-sahita-tulasī kṛṣṇa-pārśvaṁ pratasthe ||5.78||
    translation: >-
      Lalitā sends Tulasī with Kastūrī to Kṛṣṇa carrying a garland and betel,
      while the appointed play-grove is coordinated through Vṛndā and Subala.
