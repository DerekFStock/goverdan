  order: 54
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: 'Even Laksmi-devi was unable to attain even a small fragment of the mercy the gopis attained. Srila Sukadeva
    Gosvami confirmed this in the Srimad Bhagavatam (10.47.60):


    “When Lord Sri Krsna was dancing with the gopis in the rasa-lila, the gopis were embraced by the arms of the Lord. This
    transcendental favour was never bestowed upon the goddess of fortune or the other consorts in the spiritual world. Indeed,
    never was such a favour even imagined by the most beautiful girls in the heavenly planets, whose bodily lustre and aroma
    resemble those of lotus flowers. And what to speak of worldly women who are very beautiful according to the material estimation.”*'
