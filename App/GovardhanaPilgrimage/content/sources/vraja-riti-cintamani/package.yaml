  translation: When the vrajavasis say the word ‘cows’ they refer to the celestial kamadhenu cows. When they say ‘trees’ they
    mean kalpa-vrksa trees that fulfil all desires. When they say ‘rocks’ they mean cintamani gems. How is it possible to
    describe the limitless opulences of Vraja?
