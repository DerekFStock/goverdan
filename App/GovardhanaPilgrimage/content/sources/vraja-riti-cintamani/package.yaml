  verse_end: 3
  search_aliases: Braj Vrndavana Vṛndāvana Radha-kunda Rādhā-kuṇḍa Syama-kunda Śyāma-kuṇḍa Govardhan Govardhana Nandisvara
    Nandīśvara kunja kuñja
- id: passage.vraja-riti-cintamani.vrc.1.4
  locus: '1.4'
  display_locus: '1.4'
  order: 4
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: I yearn to be able to write as well as Lord Caitanya’s Rupa Gosvami, but I cannot write as well as he, and
    neither can I write as well as his followers who wrote many wonderful, perfect books, which everyone should read and remember.
    Compared to their books my little book can hardly be considered poetic.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
  chapter_passage_number: 4
