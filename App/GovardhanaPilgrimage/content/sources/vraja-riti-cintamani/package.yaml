  translation: 'If, while walking on Govardhana Hill, Krsna’s elder brother Balarama sees a series of golden stones, He thinks:
    ‘the daughter of King Vrsabhanu must have just now walked before Me’, and He changes course to avoid an awkward situation.
    In the same way, if She sees a series of crystal stones, She thinks: ‘Balarama must have just now walked before Me’, and
    She changes Her course.'
