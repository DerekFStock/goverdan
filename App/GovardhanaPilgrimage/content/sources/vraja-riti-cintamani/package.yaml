  display_locus: '1.16'
  order: 16
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: On its eastern, northern, and southern sides people free from all unhappiness reside. On its summit is Nanda
    Maharaja’s palace, which the Purana’s describe as existing since ancient times.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
