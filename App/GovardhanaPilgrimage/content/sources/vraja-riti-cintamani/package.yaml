    Nandīśvara kunja kuñja
- id: passage.vraja-riti-cintamani.vrc.1.10
  locus: '1.10'
  display_locus: '1.10'
  order: 10
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: Defeated by their humbleness, Sri Krsna eternally enjoys pastimes in their midst. In their presence He manifests
    a limitless flood of the sweetness of the most confidential transcendental mellows.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
