    Nandīśvara kunja kuñja
- id: passage.vraja-riti-cintamani.vrc.1.6
  locus: '1.6'
  display_locus: '1.6'
  order: 6
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: Sri Krsna’s friends and associates, who enjoy pastimes with Him as equals, reside in this perfectly spiritual
    abode of Vrndavana.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
  chapter_passage_number: 6
  passage_kind: verse_translation
  witness_locator: chapter 1, verse 6
  canonical_verse: '1.6'
  verse_start: 6
  verse_end: 6
  search_aliases: Braj Vrndavana Vṛndāvana Radha-kunda Rādhā-kuṇḍa Syama-kunda Śyāma-kuṇḍa Govardhan Govardhana Nandisvara
    Nandīśvara kunja kuñja
- id: passage.vraja-riti-cintamani.vrc.1.7
  locus: '1.7'
  display_locus: '1.7'
  order: 7
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: All these associates of the Lord have spiritual bodies, although their forms and activities appear ordinary
    and material to the conditioned souls. These associates of the Lord are enchanted by Lord Krsna’s charming pastimes in
    Vraja.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
  chapter_passage_number: 7
  passage_kind: verse_translation
