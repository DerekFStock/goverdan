  locus: '1.37'
  display_locus: '1.37'
  order: 37
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: When the vrajavasis say the word ‘rajah’ they do not mean ‘material passion’, but ‘the pollen of flowers’.
    When they say ‘tamah’ they do not mean ‘ignorance’, but ‘the pleasant darkness of night’. When they say ‘dvandvam’ they
    do not mean ‘the material dualities of happiness and distress’, but ‘a happy couple’. When they say ‘slowness’ they do
    not refer to the intellect, but the wind. When they say ‘restlessness’ they do not mean anything inauspicious, but rather
    ‘great eagerness to see Lord Hari’, or else ‘the charming restless glances of the Lord’. In this way they never speak
    anything unpleasant, but everything they say is pleasing and auspicious.
