- id: passage.vraja-riti-cintamani.vrc.1.11
  locus: '1.11'
  display_locus: '1.11'
  order: 11
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: Even though it appears to be material, the opulent sweet nectar shower of Lord Krsna’s pastimes is worshipped
    by the great devotees.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
