  order: 1
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: Let me glorify Vrajabhumi, the place where Sri Krsna enjoys transcendental pastimes. Simply by drinking with
    their ears the nectarean description of Vrajabhumi, the liberated souls abandon the bliss of impersonal Brahman and yearn
    to attain the land of Vraja.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
