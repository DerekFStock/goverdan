- id: passage.vraja-riti-cintamani.vrc.1.9
  locus: '1.9'
  display_locus: '1.9'
  order: 9
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: Although they are the most exalted, by the influence of the potency of pure devotion to the Lord they think
    themselves the most lowly and insignificant. I have with my own eyes seen how the people of Vraja think themselves ordinary
    even though the great saints worship them.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
