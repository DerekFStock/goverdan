  locus: '1.14'
  display_locus: '1.14'
  order: 14
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: Some portion of transcendental Vrndavana becomes visible in this world at the time of Lord Krsna’s manifest
    pastimes. Conditioned souls think Vrndavana is material, although actually it is spiritual, and beyond their ability to
    understand or describe.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
