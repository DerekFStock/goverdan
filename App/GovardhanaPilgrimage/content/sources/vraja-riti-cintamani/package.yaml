  translation: There is a pleasant grove of sandalwood trees on Govardhana Hill. Although snakes generally flock to sandalwood
    trees, no snakes ever come here, or if sometimes a snake may come it is not poisonous, or if sometimes a poisonous snake
    may come its poison is automatically counteracted, and it can do no harm. As the best servant of Lord Hari, Govardhana
    Hill has made this wonderful arrangement for the Lord’s pleasure.
