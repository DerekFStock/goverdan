  search_aliases: Braj Vrndavana Vṛndāvana Radha-kunda Rādhā-kuṇḍa Syama-kunda Śyāma-kuṇḍa Govardhan Govardhana Nandisvara
    Nandīśvara kunja kuñja
- id: passage.vraja-riti-cintamani.vrc.1.5
  locus: '1.5'
  display_locus: '1.5'
  order: 5
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: Millions of material universes and even millions of spiritual Vaikuntha planets are not very significant in
    comparison to Vrndavana, where Sri Krsna enjoyed lunch with His friends on the Yamuna’s sandy bank, and enjoyed many other
    transcendental pastimes.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
  chapter_passage_number: 5
  passage_kind: verse_translation
  witness_locator: chapter 1, verse 5
  canonical_verse: '1.5'
  verse_start: 5
  verse_end: 5
