  order: 42
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: The vrajavasis are filled with auspicious spiritual qualities. They have no material attributes. What may even
    seem to be faults on their part are actually auspicious and spiritual when seen in connection to their transcendental
    rasa with Krsna. Seeing this wonderful condition of the residents of Nanda Maharaja’s Vrajabhumi, the three modes of material
    nature have become embarrassed. They have relinquished all their pride in being able to control others.
