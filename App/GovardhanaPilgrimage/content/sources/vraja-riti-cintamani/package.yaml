    Nandīśvara kunja kuñja
  translation_note: Srila Visvanatha Cakravarti Thakura has concealed the names of Sri Krsna Caitanya, Nityananda and Advaita
    in the first two lines of this verse.
- id: passage.vraja-riti-cintamani.vrc.1.3
  locus: '1.3'
  display_locus: '1.3'
  order: 3
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: A poet’s poem becomes famous because of its quality of being poetic. I shall boldly declare that this poem
    of mine is the most poetic and best of all poems, for it glorifies the transcendental land of Vraja.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
  chapter_passage_number: 3
  passage_kind: verse_translation
  witness_locator: chapter 1, verse 3
