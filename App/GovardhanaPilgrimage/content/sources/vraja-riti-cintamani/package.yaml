  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: When the Personified Vedas saw the splendid good fortune of the vraja-gopis, they decided to follow in their
    footsteps and become gopis also. When Laksmi-devi saw the charming sweetness of the vraja-gopis, she became bewildered
    and fainted with envy. Who can describe the transcendental opulences of this land of Vraja?
