  display_locus: '1.15'
  order: 15
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: The devotees declare that Nandisvara Hill, the form of Lord Siva is now shining as Nanda Maharaja’s capitol,
    is an endlessly beautiful crown decorating Vrndavana.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
