- id: passage.vraja-riti-cintamani.vrc.1.12
  locus: '1.12'
  display_locus: '1.12'
  order: 12
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: I pray that by the mercy of its inconceivable residents I will attain the place that bears the auspicious names
    Vrndavana, Gokula-dhama, Gostha, and Vraja.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
