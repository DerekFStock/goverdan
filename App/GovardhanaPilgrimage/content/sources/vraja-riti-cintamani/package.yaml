    Nandīśvara kunja kuñja
- id: passage.vraja-riti-cintamani.vrc.1.8
  locus: '1.8'
  display_locus: '1.8'
  order: 8
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: 'Although their forms and actions are filled with spiritual knowledge, the people of Vraja know Krsna as their
    friend and relative: an ordinary person. This is not at all surprising.'
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
  chapter_passage_number: 8
  passage_kind: verse_translation
  witness_locator: chapter 1, verse 8
