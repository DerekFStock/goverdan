  locus: '1.34'
  display_locus: '1.34'
  order: 34
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: When the vrajavasis say the word ‘pradosa’ they do not mean ‘fault’, they do not mean ‘rascal’, but ‘moon’.
    When they say ‘rosa’, they do not mean anger, but ‘love’. When they say ‘mosa’ they do not mean a cruel thief, but Krsna’s
    playfully stealing the gopis’ yoghurt. In this way they never speak anything unpleasant, but everything they say is pleasing
    and auspicious.
