  display_locus: '1.33'
  order: 33
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: 'When the vrajavasis say the word ‘matsara: they do not mean ‘envy’, but ‘my lake’. When they say ‘khala’,
    they do not mean ‘demon’, but ‘a woman’s sash’. When they say ‘mala’, they do not mean ‘defect’, but ‘gentle and delicate’.
    In this way they never speak anything unpleasant, but everything they say is pleasing and auspicious.'
