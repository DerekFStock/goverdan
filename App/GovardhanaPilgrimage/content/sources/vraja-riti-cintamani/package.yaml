  locus: '1.13'
  display_locus: '1.13'
  order: 13
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: Vrndavana cannot be understood by conditioned souls, for although it may appear to be material, all its villages,
    forests, and cow-pastures are perfectly spiritual.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
