  order: 38
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: 'When the vrajavasis say the word ‘smallness’ they do not refer to the lack of anything good, but rather to
    a slender waist. When they say ‘nicagatvam’ they do not mean ‘faith in rascals’ but ‘a stream that can be easily crossed’.
    When they say the words ‘lamentation, humility, fatigue, bewilderment, sleep and laziness’ they do not mean any inauspicious
    material traits, but rather the various symptoms of ecstatic love of God.


    In this way they never speak anything unpleasant, but everything they say is pleasing and auspicious.'
