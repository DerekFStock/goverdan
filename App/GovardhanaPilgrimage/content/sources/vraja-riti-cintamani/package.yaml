  verse_end: 1
  search_aliases: Braj Vrndavana Vṛndāvana Radha-kunda Rādhā-kuṇḍa Syama-kunda Śyāma-kuṇḍa Govardhan Govardhana Nandisvara
    Nandīśvara kunja kuñja
- id: passage.vraja-riti-cintamani.vrc.1.2
  locus: '1.2'
  display_locus: '1.2'
  order: 2
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: With a pure heart let me worship Vrajabhumi, which is the form of the sweetness of meditation on Sri Krsna,
    which is eternal, transcendental, blissful, and peerless, and which, although it cannot be understood by ordinary people,
    is easily understood by its residents.
  translation_status: SUPPLIED_TRANSLATION_TRANSLATOR_UNKNOWN
  section_kind: CHAPTER
  chapter_number: 1
  chapter_title: Nandīśvara and the People of Vraja
  source_chapter_title: Chapter 1
