  display_locus: '1.35'
  order: 35
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: When the vrajavasis say the word ‘danda’, they do not mean ‘the king’s rod of chastisement’, but rather, ‘the
    handle of a parasol, camara fan, or other similar article’. When they say ‘nivi’, they do not mean ‘handcuffs’, but ‘a
    ribbon for tying the hair’. When they say ‘adhi’ they do not mean ‘headache’, but ‘ecstatic meditation on the Personality
    of Godhead’. In this way they never speak anything unpleasant, but everything they say is pleasing and auspicious.
