  display_locus: '1.36'
  order: 36
  verification_status: SUPPLIED_WITNESS_TRANSCRIPTION
  translation: When the vrajavasis say the word ‘panka’ they do not mean ‘mud’, but aromatic ointments such as musk, kunkuma,
    and sandalwood paste. When they say ‘crookedness’ they do not mean the crookedness of a thief, but the beautiful shape
    of spiral earrings or some other ornament. When they say ‘hardness’ they do not mean the hard-heartedness of a cruel person,
    but the hardness of a gem or stone. In this way they never speak anything unpleasant, but everything they say is pleasing
    and auspicious.
