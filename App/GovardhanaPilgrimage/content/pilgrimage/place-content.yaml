    category: Mādhavendra Purī sacred-memory site and Indra-abhiṣeka mound
    summary: This combined stop preserves two distinct memories beside Govinda-kuṇḍa. Caitanya-caritāmṛta directly says Mādhavendra Purī bathed at Govinda-kuṇḍa and sat beneath a tree, where Gopāla approached him as a cowherd boy carrying milk; the present bhajana-kuṭīra or baithaka memorializes that event. Nearby, local pilgrimage tradition identifies a small mound as Indra-ṭīlā, remembered as Indra’s position during Govinda’s abhiṣeka.
    why_sacred: The Mādhavendra Purī side has direct Caitanya-caritāmṛta evidence and early Bhakti-ratnākara geographic memory for the milk-bearing cowherd encounter. The Indra side has the canonical abhiṣeka in Śrīmad-Bhāgavatam 10.27.21–23 and early Govinda-kuṇḍa localization through Vraja-vilāsa-stava 74 and Bhakti-ratnākara 5.640–645. The exact mound called Indra-ṭīlā remains a later/local physical localization.
