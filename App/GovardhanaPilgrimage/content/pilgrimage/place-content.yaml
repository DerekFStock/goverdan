    category: Apsarāvana sacred kuṇḍa at the end of Govardhana
    summary: Apsarā-kuṇḍa is one of the strongest text-to-landscape identifications in the Pūñcharī cluster. Bhakti-ratnākara directly tells the pilgrim to see Apsarā-kuṇḍa at the end of Govardhana, while Vraja-bhakti-vilāsa preserves Apsarāvana and Apsarā-kuṇḍa in its pilgrimage sequence and ritual remembrance. The present water body is independently documented by the Braj Development Plan and current mapping.
    why_sacred: Bhakti-ratnākara 5.651 supplies direct place-name and relative-location evidence. Nārāyaṇa Bhaṭṭa’s Vraja-bhakti-vilāsa preserves the Apsarāvana and Apsarā-kuṇḍa pilgrimage and prayer tradition. Present Pūñcharī geography is securely corroborated by official and map sources, while later apsarā dancing, bathing, and rāsa remembrance remains correctly labeled living tradition.
    what_to_see:
      - Apsarā-kuṇḍa itself and its present ghāṭ or restored water-body setting.
      - 'The separate nearby #48 Nava/Naval-kuṇḍa.'
      - The surrounding Apsarāvana and Pūñcharī sacred landscape where it remains legible.
