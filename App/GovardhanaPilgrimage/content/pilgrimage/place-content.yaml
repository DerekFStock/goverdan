  - place_id: place.airavata-kunda
    category: Airāvata sacred kuṇḍa of the Govinda-abhiṣeka landscape
    summary: Airāvata-kuṇḍa is the living sacred-water memorial of Airāvata’s role in Kṛṣṇa’s Govinda abhiṣeka. The Bhāgavatam securely says Airāvata carried celestial Gaṅgā water in his trunk; living Braj tradition localizes where that water was gathered or stored at this kuṇḍa. The present water body has strong official geographic evidence.
    why_sacred: Śrīmad-Bhāgavatam 10.27.22–23 and Kṛṣṇa-līlā-stava 250 establish Airāvata’s service in the abhiṣeka. Braj Development Plan BDP_Gvdn_108 establishes the current kuṇḍa identity. The storage or origin explanation is local tradition, not a claim that the Bhāgavatam names Airāvata-kuṇḍa.
    what_to_see:
      - Airāvata-kuṇḍa and its current stone or ghāṭ form.
      - The relationship to the Surabhi and Rudra/Harijū sacred-water cluster.
      - The nearby but separate #60 memorial landscape.
      - Current restoration without inferring the kuṇḍa’s ancient form.
    lila: Airāvata carries heavenly Gaṅgā water in his trunk for Kṛṣṇa’s Govinda abhiṣeka. Living sacred geography remembers that water as gathered or stored at this kuṇḍa; the canonical service and later physical localization remain distinct layers.
    pilgrim_guidance: '#59 is this water body; #54 is the separate Airāvata footprint śilā. Do not treat them as duplicates. The nearby #60 memorial cluster is a different kind of place, and sacred-water tradition is not a present water-safety guarantee.'
