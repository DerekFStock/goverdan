  - place_id: place.mukharavinda-vitthalanatha-samadhi
    category: Girirāja Mukhāravinda and Viṭṭhalanātha memorial complex
    summary: 'At Jatipura, Girirāja is worshiped as Mukhāravinda—His lotus face or mouth. Garga-saṁhitā places Govardhana’s mouth in the Annakūṭa landscape; living Puṣṭimārga tradition identifies the present Jatipura rock with that sacred feature. Viṭṭhalanātha’s samādhi stands nearby as a distinct saint memorial within the same numbered stop.'
    why_sacred: 'Garga-saṁhitā 3.8.4 gives the Govardhana-mouth sacred geography, while Śrīmad-Bhāgavatam 10.24.35–36 supplies broader Kṛṣṇa/Govardhana worship context. Established milk and bhoga worship honors Girirāja here as a sacred person. Viṭṭhalanātha, or Gusāinjī, helped organize Gopāla/Śrīnāthjī service; Bhakti-ratnākara 5.804–818 witnesses his service connection in the Gāṅṭholī sequence, not the location of this samādhi. The present memorial location is preserved by living Puṣṭimārga tradition.'
    what_to_see:
      - Girirāja Mukhāravinda at the primary Jatipura marker, where milk and bhoga worship is practiced under current shrine rules.
      - 'Viṭṭhalanātha’s samādhi in the neighboring memorial complex at approximately 27.4734125, 77.4425156; it is not the Mukhāravinda rock.'
      - Vallabhācārya’s nearby baithak as a separate memorial object, not another name for the samādhi.
      - The historic Śrīnāthjī temple landscape above Jatipura as orientation only, not a destination requiring a climb onto Girirāja.
    lila: 'The early sacred-geography layer remembers Govardhana’s mouth at the Annakūṭa landscape. Living pilgrimage identifies and worships the present Jatipura Mukhāravinda as that mouth. A separate historical-devotional layer remembers Viṭṭhalanātha and the Puṣṭimārga service of Gopāla/Śrīnāthjī at his nearby samādhi.'
    pilgrim_guidance: 'Use established shrine access and current temple rules for milk or bhoga offerings. Do not climb onto Girirāja to seek the historic hilltop temple. Treat Viṭṭhalanātha’s samādhi and Vallabhācārya’s baithak as distinct saint memorials. This #61 Jatipura Mukhāravinda is not #18 Mānasī-gaṅgā Mukhāravinda.'
