  - place_id: place.harideva-temple
    category: Harideva deity and Mahāprabhu pilgrimage temple
    summary: Harideva Temple is one of the principal sacred temples of Govardhana. Śrī Caitanya Mahāprabhu came to Govardhana-grāma, saw Harideva, offered obeisances, danced in ecstasy before Him, and later stayed the night at the temple.
    why_sacred: Caitanya-caritāmṛta, Madhya 18.17 records Mahāprabhu seeing Harideva, verse 18 glorifies Harideva, verse 19 describes Mahāprabhu dancing before Him, and verse 22 records Mahāprabhu staying the night at the temple. Rūpa Gosvāmī’s Mathurā-māhātmya supplies broader Govardhana pilgrimage context, but the currently compiled 418–423 slice does not directly identify this temple. A tradition that Vajranābha installed Harideva is retained only as traditional pilgrimage narration.
