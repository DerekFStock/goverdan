    category: Sacred ancestral-obligation kuṇḍa
    summary: Ṛṇa-mocana-kuṇḍa is a restored sacred pond in Govardhan associated in local pilgrimage tradition with release from obligation or debt, especially ancestral obligation.
    why_sacred: The Sanskrit word ṛṇa means debt or obligation, while mocana means release or freeing. Local Govardhana tradition connects this place with tarpaṇa and ancestral obligations. Restoration-era reporting transmits an account of Dvārakādhīśa Kṛṣṇa performing tarpaṇa here with Nanda Bābā, Yaśodā, and Dauji, and connects the site with Gayā-tīrtha. These are Braj pilgrimage traditions, not narratives established here from Śrīmad-Bhāgavatam or a Gosvāmī work.
