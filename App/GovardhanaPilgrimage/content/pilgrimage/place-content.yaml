  - place_id: place.govinda-kunda
    category: Indra–Surabhi abhiṣeka kuṇḍa and Mādhavendra Purī sacred landscape
    summary: Govinda-kuṇḍa is one of Govardhana’s most textually secure sacred waters. Śrīmad-Bhāgavatam narrates the abhiṣeka in which Surabhi bathes Kṛṣṇa with milk and Indra bathes Him with heavenly Gaṅgā water, giving Him the name Govinda. Bhakti-ratnākara explicitly localizes that abhiṣeka at Govinda-kuṇḍa, and Caitanya-caritāmṛta later places Mādhavendra Purī here before Gopāla approaches him as a cowherd boy.
    why_sacred: Śrīmad-Bhāgavatam 10.27.21–23 supplies the canonical Indra and Surabhi abhiṣeka and the name Govinda, but does not itself name this modern water body. Raghunātha dāsa Gosvāmī’s Vraja-vilāsa-stava 74 and Bhakti-ratnākara 5.640–645 provide the direct early Gauḍīya Govinda-kuṇḍa localization. Caitanya-caritāmṛta Madhya 4.23 directly records Mādhavendra Purī bathing and resting here.
    what_to_see:
      - The large stepped Govinda-kuṇḍa water body.
      - The stone ghāṭs as its current physical form, without assuming that all present masonry is ancient.
      - The western-bank Mādhavendra Purī sacred-memory area where it is currently identifiable.
      - 'The neighboring #43 Nīpa-kuṇḍa and Rādhā-Govinda shrine cluster and the wider Gopāla landscape.'
    lila: 'After Indra’s pride is broken in Govardhana-līlā, Surabhi bathes Kṛṣṇa with milk and Indra uses celestial Gaṅgā water; Kṛṣṇa is acclaimed as Govinda. Early Gauḍīya pilgrimage tradition localizes that abhiṣeka here. In a later historical layer, Mādhavendra Purī comes after Govardhana parikramā, bathes, and rests beneath a tree before the cowherd boy Gopāla brings him milk and begins the discovery narrative leading to #41.'
    pilgrim_guidance: '#42 is the kuṇḍa itself. #44 represents nearby sacred features connected with Mādhavendra Purī and Indra, while #43 is the neighboring Nīpa-kuṇḍa and Rādhā-Govinda cluster. Current water appearance or restoration does not establish the kuṇḍa’s ancient physical form, and no bathing-safety assurance is made.'
