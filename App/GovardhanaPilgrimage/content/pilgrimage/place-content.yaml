      - place.jatipura-village

  - place_id: place.jatipura-village
    category: Living Śrīnāthjī / Girirāja pilgrimage village
    summary: 'Jatipura is a living village at the foot of Girirāja, shaped by Gopāla/Śrīnāthjī worship and Puṣṭimārga service. Mukhāravinda worship, memorials, baithaks, kīrtana, and Annakūṭa culture coexist with ordinary residential life. This page orients pilgrims to the village rather than duplicating a single shrine.'
    why_sacred: 'The village has a deep Gopāla/Śrīnāthjī service history and remains central to Govardhana parikramā. Gopālapura is a remembered name linked with Gopāla. Popular tradition explains Jatipura as Yati-pura, “the settlement of the yati,” but different devotional traditions identify that yati differently; this is not a settled documentary etymology.'
    what_to_see:
      - The Mukhāravinda area and its separate #61 detail page.
      - Daṇḍavat-śilā as distinct #62.
      - The Śrīnāthjī temple landscape, Vallabha and Viṭṭhalanātha memorials, and active sevā streets where publicly accessible.
      - The relationship of village life to Girirāja, rather than any invented village boundary.
    lila: 'Jatipura is primarily living devotional and historical sacred geography: generations of Vaiṣṇava sevā, Gopāla/Śrīnāthjī worship, Annakūṭa offerings, and kīrtana at the foot of Govardhana. It is not one isolated Kṛṣṇa-līlā site.'
    pilgrim_guidance: '#63 is a representative village/area marker, not an exact shrine or boundary. Use #61 and #62 for site-specific guidance, respect residential and private temple thresholds, and do not treat map-number order as a route through private lanes. Crowds and traffic may be heavy on parikramā or festival days.'
