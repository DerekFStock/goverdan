  - place_id: place.dandavat-sila
    category: Govardhana śilā of repentance and daṇḍavat
    summary: 'Daṇḍavat-śilā is a revered Govardhana stone at Jatipura where pilgrims and temple servants offer prostrations in humility and repentance, especially for inadvertently stepping upon Girirāja in service or parikramā. It is a distinct stop from the nearby Mukhāravinda.'
    why_sacred: 'Entwistle documented a round stone below the Śrīnāthjī temple receiving milk anointing and prostrations as contrition. Living pilgrimage tradition also remembers seven circumambulations with daṇḍavats. That practice is a prayer for forgiveness, not a scriptural or automatic guarantee of absolution.'
    what_to_see:
      - The decorated or worshiped Govardhana śilā in its small shrine setting.
      - Milk or other anointing where currently permitted by local practice.
      - Its relation to the Jatipura Mukhāravinda and Śrīnāthjī service landscape.
    lila: 'This is a devotional-practice site rather than a distinct Kṛṣṇa-līlā episode. Bowing here expresses reverence for Girirāja as a living sacred person and repentance for accidental offenses.'
    pilgrim_guidance: 'Bow respectfully; do not step over or on the śilā. If offering circumambulations or full daṇḍavats, follow current local practice and avoid obstructing others. This custom does not give permission to step on Girirāja elsewhere. #62 remains separate from #61.'
    references:
      - id: reference.dandavat-sila.entwistle
        source_title: Entwistle — Dandauti Sila
        locus: Jatipura pilgrimage survey
        explanation: Documents the established śilā and contrition/prostration custom.
      - id: reference.dandavat-sila.living-tradition
        source_title: Living Jatipura Daṇḍavat-śilā tradition
        locus: Daṇḍavat-śilā
        explanation: Seven-round and daṇḍavat practice as contemporary prayer for forgiveness.
