  - place_id: place.indra-puja
    category: Indra’s repentance and worship-of-Kṛṣṇa shrine
    summary: Indra-pūjā is the living Govardhana shrine remembering the moment after Indra’s pride was broken, when the king of heaven approached Kṛṣṇa in shame, bowed at His feet, offered prayers, and begged forgiveness. It does not mean the earlier Vrajavāsī Indra-yajña; it remembers Indra worshiping and surrendering to Kṛṣṇa.
    why_sacred: Śrīmad-Bhāgavatam 10.27.2–17 narrates Indra’s confession, surrender, and Kṛṣṇa’s mercy and instruction. Kṛṣṇa-līlā-stava 247–249 summarizes his crown touching Kṛṣṇa’s feet and the destruction of pride. Bhakti-ratnākara 5.657 preserves the local Indra-mercy association beside Airāvata’s footprint.
    what_to_see:
      - The current Indra Mān-bhaṅga or Indra-pūjā shrine.
      - The immediately adjacent but separate Airāvata’s footprint shrine.
      - The Govardhana setting in which humility and mercy are remembered.
    lila: Indra comes before Kṛṣṇa without pride, bows until his crown touches Kṛṣṇa’s feet, confesses his offense, and takes shelter. Kṛṣṇa explains that stopping the sacrifice was mercy intended to destroy false pride and restores Indra to his duty. Living tradition localizes this repentance and worship beside Airāvata’s footprint.
    pilgrim_guidance: The pin identifies the current Indra Mān-bhaṅga shrine. Do not climb or scramble on Girirāja, and keep #54 and #55 distinct. Read “Indra-pūjā” as Indra’s worship and surrender to Kṛṣṇa, not as an instruction or claim that the Vrajavāsīs performed the earlier Indra-yajña here.
