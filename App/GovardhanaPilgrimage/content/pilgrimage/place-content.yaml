  - place_id: place.sant-nivas
    category: Modern parikramā ashram and landmark
    summary: Sant Nivas is a living modern ashram and practical pilgrimage landmark near Gvāla-pokhara. Its importance here is devotional service and orientation on the parikramā route, not a claim that it is an ancient Kṛṣṇa-līlā site.
    why_sacred: The ashram’s official history says it was established in 1982 by Śrī Śrī 108 Sant K. P. Ramanujdas Ji as a place of devotional service. The living complex includes worship of Brajeśvarī Devī and Brajeśvara Mahādeva, the founder’s samādhi and prayer space, and a small gauśālā. Traditional pilgrimage directions also use Sant Nivas as the roadside landmark for approaching Gvāla-pokhara.
    what_to_see:
      - The active Sant Nivas ashram and its devotional community.
      - The shrines of Brajeśvarī Devī and Brajeśvara Mahādeva.
      - The founder’s samādhi and prayer space.
      - The small gauśālā maintained as part of the ashram’s service.
      - 'Notice its practical relationship to the approach for #13 Gvāla-pokhara while keeping the ashram and pond distinct.'
    lila: Sant Nivas belongs to Govardhana’s living modern devotional layer. No ancient Kṛṣṇa-līlā is assigned to the ashram; pilgrims may honor its worship, service, founder lineage, and continuing care for cows.
    pilgrim_guidance: 'Navigate first to #13 Gvāla-pokhara. From the pond, return approximately 170 m along the dirt approach path toward the main parikramā road; Sant Nivas is described as directly across from that approach. Reaching #13 means arriving at the navigation anchor, not the exact ashram, whose independent coordinate remains unverified.'
