  - place_id: place.rudra-kunda-hariju-kunda
    category: Rudra meditation kuṇḍa and Harijū sacred-water cluster
    summary: 'This numbered stop preserves two related but distinct physical water bodies. Rudra-kuṇḍa has strong early Gauḍīya support: Bhakti-ratnākara remembers Mahādeva absorbed in meditation on Kṛṣṇa here. Harijū-kuṇḍa is a separate nearby water body preserved through living Braj tradition and officially documented as Hariju/Harji Kund. Their evidence levels remain distinct.'
    why_sacred: Rudra-kuṇḍa is directly supported by Bhakti-ratnākara 5.659; later tradition remembers Mahādeva’s tears and the Rudana name. Harijū-kuṇḍa is officially documented, while its Harijū-sakhā and Rādhā-Kṛṣṇa bathing associations remain local pilgrimage tradition rather than early textual claims.
    what_to_see:
      - 'Rudra-kuṇḍa at the primary map marker: 27.4746611, 77.4409917.'
      - The current Rudra or Mahādeva shrine where present.
      - 'Harijū/Harji-kuṇḍa as a separate second water body at 27.4714222, 77.4380889.'
      - Current ghāṭ and restored landscape layers without inferring their ancient appearance.
    lila: Bhakti-ratnākara remembers Mahādeva absorbed in meditation on Kṛṣṇa at Rudra-kuṇḍa. Later tradition connects his tears with the Rudana name. Separately, living tradition associates Harijū-kuṇḍa with Harijū sakhā and Rādhā-Kṛṣṇa water pastimes.
    pilgrim_guidance: Navigate to the Rudra-kuṇḍa primary pin. Harijū-kuṇḍa is a second feature with its own official coordinate; do not mistake one for the other or assume present access matches older descriptions. Sacred-water tradition is not a bathing-safety guarantee.
