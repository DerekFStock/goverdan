  - place_id: place.airavata-footprint
    category: Airāvata footprint śilā in Govardhana’s Indra-abhiṣeka landscape
    summary: Airāvata’s footprint is a sacred Govardhana rock feature with strong textual support. Bhakti-ratnākara points it out directly, Garga-saṁhitā includes it in Girirāja’s sacred body, and the Bhāgavatam remembers Airāvata carrying heavenly Gaṅgā water for Kṛṣṇa’s abhiṣeka after Indra’s pride was broken. The present shrine is the living localization of that sacred geography.
    why_sacred: Bhakti-ratnākara 5.657 directly identifies the footprint; Garga-saṁhitā 3.8.10 describes Airāvata’s footprint as the feet of Govardhana’s personal sacred body. Śrīmad-Bhāgavatam 10.27.22–23 and Kṛṣṇa-līlā-stava 247–250 provide the Airāvata abhiṣeka and Indra-surrender context. No archaeological test is claimed.
