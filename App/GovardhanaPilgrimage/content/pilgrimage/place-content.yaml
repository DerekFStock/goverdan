    why_sacred: Śrīmad-Bhāgavatam 10.21.18 praises Govardhana because its grasses, waters, caves, and roots are sanctified by the feet of Kṛṣṇa and Balarāma. Caitanya-caritāmṛta, Madhya 18.34 records Mahāprabhu’s reverence for a Govardhana stone bearing Kṛṣṇa’s footprints, and Garga-saṁhitā 3.4.13 describes Govardhana’s stones marked with divine footprints. These texts establish the sacred meaning of footprints on Govardhana; the identification of this particular modern rock comes from local pilgrimage tradition.
    what_to_see:
