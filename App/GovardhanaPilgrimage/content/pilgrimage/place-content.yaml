        source_title: Local Ṛṇa-mocana-kuṇḍa restoration report
        locus: Rediscovery and restoration opposite the Govardhan electricity house
        explanation: Supports the restored modern site and transmits its tarpaṇa tradition; it is modern restoration and pilgrimage evidence, not a canonical śāstric source.
