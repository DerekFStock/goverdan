  - place_id: place.gantholi
    category: Holī, Gopāla and Mahāprabhu sacred village
    summary: 'Gāṅṭholī joins two strong early Gauḍīya sacred histories. Bhakti-ratnākara explains its name through a sakhī tying Rādhā and Kṛṣṇa’s garments during Holī and directly names Gulāla-kuṇḍa. Caitanya-caritāmṛta records Gopāla being moved here temporarily and Śrī Caitanya Mahāprabhu coming to the village for His darśana.'
    why_sacred: 'Bhakti-ratnākara 5.797–818 preserves the Holī knot, Gulāla-kuṇḍa, and Gopāla/Viṭṭhalanātha service history. Caitanya-caritāmṛta Madhya 18.29–41 directly tells of Gopāla’s temporary residence in Gāṅṭhuli-grāma and Mahāprabhu’s visit, kīrtana, and darśana. These texts anchor the sacred landscape, not the exact position of the historic brāhmaṇa house.'
    what_to_see:
      - The living Gāṅṭholī village landscape at a representative area marker.
      - Gulāla-kuṇḍa at its separate #64 point.
      - Recognized public Gopāla or Śrīnāthjī memory sites and baithaks where currently preserved, without assuming a private house is publicly accessible.
    lila: 'In the Holī layer, the sakhīs’ garment knot gives the early pilgrimage explanation of Gāṅṭholī’s name. In the Gopāla/Mahāprabhu layer, Gopāla is moved from Govardhana for safety and stays here temporarily; Mahāprabhu comes for darśana and spends days chanting and dancing before Him before Gopāla returns to His own temple.'
    pilgrim_guidance: '#65 is a representative village marker, not the exact historic brāhmaṇa house or Gopāla’s permanent hilltop temple. Visit recognized public shrines for darśana, respect residential life, and use #64 for the kuṇḍa itself. Map-number sequence is not yet a walking route.'
