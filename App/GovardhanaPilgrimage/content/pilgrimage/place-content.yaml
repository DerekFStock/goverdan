  - place_id: place.gvala-pokhara
    category: Cowherd-boys’ sacred pond
    summary: Gvāla-pokhara is remembered as a pond where Kṛṣṇa and the cowherd boys rested and ate together while tending the cows. Pilgrimage tradition explains its name through this cowherd association and also preserves Gopāla-kuṇḍa as a traditional alias.
    why_sacred: Local pilgrimage tradition remembers the cowherd boys eating and resting here and tells of Kṛṣṇa slipping away from His companions. Śrīmad-Bhāgavatam 10.21.18–19 supplies the broader canonical world of Kṛṣṇa and Balarāma tending cows around Govardhana, but those verses do not name this pond or prove its modern coordinate.
    what_to_see:
      - The pond itself and its pastoral setting near Govardhana.
      - Trees, fields, and the surrounding landscape that help evoke the cowherding setting.
      - Pilgrimage tradition says sacred stones may emerge here; treat any such identification as local tradition rather than a project-certified archaeological finding.
      - 'Use #13 as the navigation anchor for coordinate-less #14 Sant Nivas, while preserving the two places as distinct identities.'
    lila: Pilgrimage tradition remembers Kṛṣṇa and His cowherd friends sharing a meal and resting here during their daily grazing. The broader Bhāgavatam passages support this pastoral devotional setting without naming Gvāla-pokhara itself.
    pilgrim_guidance: 'Use the verified #13 coordinate to orient at the pond. #14 Sant Nivas is a separate modern ashram landmark reached by returning toward the main parikramā road; arrival at #13 is only the navigation anchor for #14.'
    references:
