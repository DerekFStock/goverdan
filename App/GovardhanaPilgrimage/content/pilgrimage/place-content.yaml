  - place_id: place.rasa-sthali
    category: Sacred rāsa platform
    summary: Rāsa-sthalī is the remembered springtime rāsa ground in the Śyāmavana and Ratna-siṁhāsana landscape. Its sacred identity has strong traditional and Gosvāmī textual support even though its exact modern GPS coordinate remains unverified.
    why_sacred: Raghunātha Dāsa Gosvāmī’s Govardhanāśraya-daśakam 7 directly describes a rāsa-sthalī at Govardhana where Śrī Rādhā dances in spring surrounded by sakhīs and embraced by Kṛṣṇa. Bhakti-ratnākara invokes that work when describing the Govardhana rāsa-sthalī, while traditional guides identify the concrete or circular platform in the Śyāma-kuṭī and Ratna-siṁhāsana complex.
    what_to_see:
      - Look for the distinct rāsa platform within the Ratna-kuṇḍa and Śyāma-kuṭī complex.
      - 'The stored coordinate remains absent; the hollow question-mark marker is a cartographic presentation derived from #11 Ratna-siṁhāsana.'
      - 'Treat #11 only as a navigation anchor: reaching it is not exact arrival at #10.'
    lila: Śrī Rādhā dances beautifully upon the spring rāsa ground, surrounded by Her sakhīs, while Kṛṣṇa embraces Her with His fragrant arm.
    pilgrim_guidance: 'Locate the distinct rāsa platform within the Ratna-kuṇḍa and Śyāma-kuṭī sacred complex near #11 Ratna-siṁhāsana. The exact GPS coordinate has not yet been field verified.'
