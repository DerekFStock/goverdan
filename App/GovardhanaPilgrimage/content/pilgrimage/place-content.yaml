  - place_id: place.gopala-raja-temple
    category: Gopāla Rāja hilltop shrine and Mādhavendra Purī sacred-memory site
    summary: 'Gopāla Rāja Temple belongs to one of Govardhana’s most important Gopāla traditions. Raghunātha dāsa Gosvāmī’s fifteen-verse Gopāla-rāja-stotra repeatedly presents Gopāla Rāja shining splendidly on the mountain plateau, while Caitanya-caritāmṛta narrates Mādhavendra Purī recovering Gopāla and establishing His worship on Govardhana. The modern shrine is a received pilgrimage identification of that sacred geography, not proof that the present building is unchanged from the sixteenth century.'
    why_sacred: Śrī Gopāla-rāja-stotra 1–15 provides unusually strong Gosvāmī textual support and repeatedly emphasizes Gopāla Rāja on the giri-paṭṭa, the mountain plateau. Caitanya-caritāmṛta, Madhya 4 narrates Gopāla revealing Himself to Mādhavendra Purī, asking to be recovered, and being established for worship on Govardhana as Giridhārī. Traditional pilgrimage identifies the present shrine with that hilltop sacred memory while keeping architectural continuity a separate, unproven question.
    what_to_see:
      - The present Gopāla Rāja shrine within Govardhana’s sacred-hill setting.
      - The Govardhana-śilā reported as presently worshiped there, where current shrine conditions confirm it.
      - 'The relationship with #38 Śiva Temple, traditionally described as beside this shrine.'
    lila: Mādhavendra Purī is directed by Gopāla to recover Him from concealment and establish His worship on Govardhana. Raghunātha’s Gopāla-rāja-stotra later presents Gopāla Rāja shining upon the mountain plateau. The present temple is visited as a living shrine within that received sacred geography.
    pilgrim_guidance: 'The map pin identifies a sacred-location reference; it is not permission to climb, scramble, or step onto Girirāja. Approach only by an established, locally accepted pilgrimage access. If the shrine cannot be reached without stepping on Girirāja in a way contrary to your devotional practice, take darśana from the legitimate accessible point instead. Keep #37 distinct from the not-yet-authored Gopāla manifestation place #41.'
