  - place_id: place.mani-kandali-cave
    category: Rāghava Paṇḍita’s Govardhana cave and Rādhā-Kṛṣṇa sacred-memory site
    summary: Maṇi-kandalī Cave is the living pilgrimage identification of the Govardhana cave where Rāghava Paṇḍita performed bhajana. Bhakti-ratnākara gives strong early evidence by recording Rāghava pointing out his own cave and remembering Govardhana’s caves as places of Rādhā-Kṛṣṇa’s pastimes. The specific Maṇi-kandalī name belongs to later received localization.
    why_sacred: Bhakti-ratnākara 5.653–656 presents Rāghava Paṇḍita’s cave and his delight in Govardhana’s beauty. Vraja-vilāsa-stava 65 praises Govardhana caves as Rādhā-Kṛṣṇa līlā places, while continuing tradition preserves this as Rāghava’s bhajana site. The present cave structure is not claimed to be archaeologically unchanged.
