    lila: Pilgrimage tradition remembers ancestral tarpaṇa here and associates the restored kuṇḍa with release from obligation. The account is preserved as local Braj tradition rather than upgraded into a canonical śāstric episode.
    pilgrim_guidance: 'Older pilgrimage guides may describe Ṛṇa-mocana-kuṇḍa as lost, dried, or difficult to find because they predate its restoration. This #25 place is strictly distinct from future #31 Pāpa-mocana-kuṇḍa; the names, identities, and coordinates must not be merged.'
