    lila: Mahāprabhu entered Govardhana-grāma during His Govardhana pilgrimage and went to see Harideva. The town is therefore remembered as the living settlement through which the pilgrimage unfolds, not as a single-event monument.
    pilgrim_guidance: 'Map place #24 is an area marker within Govardhan Town. Arrival means reaching the representative town area; do not expect one exact sacred object at the pin. Use the individual place records for specific nearby shrines and kuṇḍas.'
