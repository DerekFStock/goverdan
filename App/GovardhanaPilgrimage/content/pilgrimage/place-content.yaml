  - place_id: place.manasiganga
    category: Sacred lake and naukā-vilāsa tīrtha
    summary: Mānasī-gaṅgā is the great sacred lake at Govardhan town and one of the major orientation centers of Govardhana parikramā. Gauḍīya literature remembers it especially as a place of Rādhā and Kṛṣṇa’s boating pastimes, and Śrī Caitanya Mahāprabhu bathed here before beginning His circumambulation of Govardhana.
    why_sacred: Raghunātha Dāsa Gosvāmī’s Vraja-vilāsa-stava 64 directly praises Mānasī-gaṅgā and remembers Rādhā-Kṛṣṇa’s boating pastimes. Viśvanātha Cakravartī Ṭhākura’s Govardhanāṣṭakam 7 describes Rādhā in Kṛṣṇa’s boat, clinging to Him when He playfully makes it appear to sink. Garga-saṁhitā 3.7.7 names Mānasī-gaṅgā among Govardhana’s great tīrthas, and Caitanya-caritāmṛta, Madhya 18.32 records Mahāprabhu bathing here before continuing around Govardhana. Later traditions preserve varying manifestation accounts rather than one exclusive narrative.
    what_to_see:
      - The large Mānasī-gaṅgā lake.
      - The ghāṭa and temple-lined sacred urban environment, without assigning unsupported names to individual ghāṭas.
      - 'Its immediate relationship with #18 Mukhāravinda and #19 Cakra-tīrtha.'
      - The lake as a major sacred hub and orientation center rather than an isolated map pin.
    lila: Rādhā and Kṛṣṇa enjoy playful boating on Mānasī-gaṅgā. In Viśvanātha Cakravartī Ṭhākura’s meditation, Kṛṣṇa makes the boat appear endangered and Rādhā clings to Him. Śrī Caitanya Mahāprabhu later bathed here before beginning His Govardhana parikramā.
    pilgrim_guidance: 'Use Mānasī-gaṅgā as a major orientation center in Govardhan town. Visit #18, #19, and #20 as distinct but tightly connected sacred stops; the current provisional coordinate confidence remains visible in the collapsed research section.'
