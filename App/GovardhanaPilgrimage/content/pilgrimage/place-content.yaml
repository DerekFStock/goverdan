    lila: Here the pilgrim remembers Govardhana as ground personally touched by Kṛṣṇa and Balarāma while They tended the cows. The project does not assign an additional specific event to this particular rock without stronger evidence.
    pilgrim_guidance: 'Navigate to #11 Ratna-siṁhāsana, then look outside the ashram entrance. Traditional guidance places the footprint roughly 7 m before the entrance and about 7 m into the trees. Reaching #11 is arrival at the navigation anchor, not exact arrival at #12; the rock’s coordinate still requires field verification.'
