    why_sacred: The shrine belongs to the living sacred landscape surrounding Mānasī-gaṅgā and Brahma-kuṇḍa. Pilgrimage tradition preserves the name Mānasī-devī, while modern discussion and institutional geography also use Manasā or Mansa Devī. The project preserves this naming nuance without forcing a simplified historical identification or claiming an unattested Gosvāmī locus.
