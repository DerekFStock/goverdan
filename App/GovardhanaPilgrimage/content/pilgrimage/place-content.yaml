  - place_id: place.brahma-kunda
    category: Sacred kuṇḍa of Mahāprabhu’s Govardhana pilgrimage
    summary: Brahma-kuṇḍa is the sacred pond in the Mānasī-gaṅgā and Harideva precinct where Śrī Caitanya Mahāprabhu bathed during His Govardhana pilgrimage.
    why_sacred: Caitanya-caritāmṛta, Madhya 18.21 directly records that Balabhadra Bhaṭṭācārya cooked at Brahma-kuṇḍa and that Mahāprabhu bathed there and then took His meal. This direct narrative is the primary textual anchor. A further account connecting the kuṇḍa with Brahmā and abhiṣeka belongs to traditional pilgrimage narration rather than established direct evidence in the current project corpus.
