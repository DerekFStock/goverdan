  - place_id: place.krsna-footprint
    category: Sacred Govardhana footprint rock
    summary: Near Śyāma-kuṭī, local Vraja pilgrimage tradition preserves a Govardhana rock bearing what is revered as the impression of Kṛṣṇa’s foot. The sacred importance of Kṛṣṇa’s footprints on Govardhana has strong śāstric support, while the exact modern GPS position of this particular rock remains unverified.
    why_sacred: Śrīmad-Bhāgavatam 10.21.18 praises Govardhana because its grasses, waters, caves, and roots are sanctified by the feet of Kṛṣṇa and Balarāma. Caitanya-caritāmṛta, Madhya 18.34 records Mahāprabhu’s reverence for a Govardhana stone bearing Kṛṣṇa’s footprints, and Garga-saṁhitā 3.4.13 describes Govardhana’s stones marked with divine footprints. These texts establish the sacred meaning of footprints on Govardhana; the identification of this particular modern rock comes from local pilgrimage tradition.
    what_to_see:
      - The locally revered footprint-bearing rock near the Śyāma-kuṭī complex.
      - Traditional accounts describe the footprint as marked or painted; its present appearance may vary.
      - 'Because its exact coordinate is unverified, navigate first to #11 Ratna-siṁhāsana and follow the approved local guidance from the ashram entrance.'
    lila: Here the pilgrim remembers Govardhana as ground personally touched by Kṛṣṇa and Balarāma while They tended the cows. The project does not assign an additional specific event to this particular rock without stronger evidence.
    pilgrim_guidance: 'Navigate to #11 Ratna-siṁhāsana, then look outside the ashram entrance. Traditional guidance places the footprint roughly 7 m before the entrance and about 7 m into the trees. Reaching #11 is arrival at the navigation anchor, not exact arrival at #12; the rock’s coordinate still requires field verification.'
    references:
      - id: reference.krsna-footprint.srimad-bhagavatam-10-21-18
        source_title: Śrīmad-Bhāgavatam
        locus: '10.21.18'
        explanation: Praises Govardhana because its landscape is sanctified by the feet of Kṛṣṇa and Balarāma; it does not identify this particular modern rock.
      - id: reference.krsna-footprint.caitanya-caritamrta-madhya-18-34
