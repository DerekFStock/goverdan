    lila: After Govardhana parikramā, Mādhavendra Purī bathes in Govinda-kuṇḍa and sits beneath a tree. Gopāla appears as a cowherd boy and brings him milk, then reveals His hidden location in a dream. In a much earlier līlā layer, Surabhi and Indra bathe Kṛṣṇa and He is acclaimed as Govinda. Early Gauḍīya literature localizes the abhiṣeka at Govinda-kuṇḍa; the particular mound called Indra-ṭīlā is its later local physical remembrance.
