  - place_id: place.rna-mocana-kunda
    category: Sacred ancestral-obligation kuṇḍa
    summary: Ṛṇa-mocana-kuṇḍa is a restored sacred pond in Govardhan associated in local pilgrimage tradition with release from obligation or debt, especially ancestral obligation.
    why_sacred: The Sanskrit word ṛṇa means debt or obligation, while mocana means release or freeing. Local Govardhana tradition connects this place with tarpaṇa and ancestral obligations. Restoration-era reporting transmits an account of Dvārakādhīśa Kṛṣṇa performing tarpaṇa here with Nanda Bābā, Yaśodā, and Dauji, and connects the site with Gayā-tīrtha. These are Braj pilgrimage traditions, not narratives established here from Śrīmad-Bhāgavatam or a Gosvāmī work.
    what_to_see:
      - The restored kuṇḍa itself.
      - The present sacred and restoration setting.
      - Dvārakādhīśa or tarpaṇa imagery only where it is actually present and identifiable during the visit.
    lila: Pilgrimage tradition remembers ancestral tarpaṇa here and associates the restored kuṇḍa with release from obligation. The account is preserved as local Braj tradition rather than upgraded into a canonical śāstric episode.
    pilgrim_guidance: 'Older pilgrimage guides may describe Ṛṇa-mocana-kuṇḍa as lost, dried, or difficult to find because they predate its restoration. This #25 place is strictly distinct from future #31 Pāpa-mocana-kuṇḍa; the names, identities, and coordinates must not be merged.'
    references:
