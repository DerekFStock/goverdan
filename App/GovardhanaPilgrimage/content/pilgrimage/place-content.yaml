      - The simple Rāghava Paṇḍita sacred-memory setting.
      - The nearby Nāthjī Temple and surrounding Sutalavana landscape.
      - External darśana when access is closed or restricted.
    lila: Rāghava Paṇḍita brings Śrīnivāsa and Narottama to the cave where he stays and contemplates Govardhana’s beauty. The text then praises Govardhana’s caves as places of Rādhā and Kṛṣṇa’s pastimes, in restrained devotional remembrance.
    pilgrim_guidance: Use the established approach to Rāghava Paṇḍita’s Cave. Do not enter a sealed cave or climb, scrape, or scramble on Girirāja. If access is restricted, take darśana from the accepted external point; the pin identifies mapped access, not permission to explore the mountain.
