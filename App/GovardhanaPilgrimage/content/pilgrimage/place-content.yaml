    lila: Early Gauḍīya and Vraja pilgrimage literature preserves Apsarā-kuṇḍa as a tīrtha at Govardhana’s end and gives it a bathing and prayer tradition. In a later/local layer, living parikramā tradition remembers heavenly apsarās dancing or bathing here and connects the kuṇḍa with rasa-filled remembrance of Rādhā and Kṛṣṇa; no unsupported precise number of apsarās is asserted.
