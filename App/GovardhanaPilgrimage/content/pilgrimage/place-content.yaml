      - The immediately adjacent but separate Indra-pūjā or Indra Mān-bhaṅga shrine.
      - The surrounding Govardhana setting without conflating this place with future Airāvata-kuṇḍa.
    lila: After Indra’s pride was broken, he approached Kṛṣṇa in humility. Surabhi performed abhiṣeka with milk, and Airāvata brought celestial Gaṅgā water. Bhakti-ratnākara connects this footprint place with Indra speaking of Kṛṣṇa’s extraordinary mercy.
    pilgrim_guidance: The pin identifies the present footprint shrine and access. Do not climb onto surrounding Girirāja or step on the footprint śilā. Receive darśana according to local etiquette, and keep #54 and #55 distinct despite their close proximity.
