  - place_id: place.jatipura-samadhi-cluster
    category: Jatipura Vaiṣṇava samādhi and memorial cluster
    summary: 'The #60 stop is not one tomb but a memorial landscape encountered as the parikramā approaches Jatipura. Jatipura became a major center of Śrīnāthjī and Puṣṭimārga devotion, and many saintly memorials accumulated here. Govind Svāmī’s samādhi near Airāvata-kuṇḍa is one identifiable example, not the sole identity of this cluster.'
    why_sacred: 'Samādhi is a Vaiṣṇava memorial form, and documentary scholarship identifies Jatipura as a concentrated Puṣṭimārga saint landscape. Govind Svāmī provides one documented example linked with Śrīnāthjī kīrtana. Parmanand Dāsa’s samādhi remains at #57; Vitthalanātha’s samādhi belongs to future #61, and no complete list is fabricated here.'
    what_to_see:
      - Several saint memorial or samādhi sites as the parikramā approaches Jatipura.
      - Govind Svāmī’s samādhi as one identifiable landmark in the wider cluster.
      - Individually maintained memorials with their own custodians and traditions.
      - An area and cluster landscape rather than one building or single tomb.
    lila: This is primarily Vaiṣṇava historical and devotional geography, not a Kṛṣṇa-līlā site in itself. It remembers saints who lived, sang, performed bhajana, and served Śrīnāthjī and Govardhana here, including Govind Svāmī’s place in the Śrīnāthjī kīrtana tradition.
    pilgrim_guidance: 'Navigate first to #59 Airāvata-kuṇḍa. Reaching #59 means At navigation anchor, not exact arrival at #60. Continue through the Jatipura memorial landscape with local guidance, identify named samādhis before attribution, and maintain quiet, respectful darśana without assuming photography or entry is always appropriate.'
