      - 'Its close relationship with #22 Mānasī-devī Temple and #23 Harideva Temple.'
      - 'Its place within the wider #20 Mānasī-gaṅgā sacred precinct.'
    lila: Remember Śrī Caitanya Mahāprabhu bathing here while Balabhadra Bhaṭṭācārya prepared food, and Mahāprabhu taking His meal after bathing during His pilgrimage around Govardhana.
    pilgrim_guidance: 'Identify the kuṇḍa within the dense Mānasī-gaṅgā and Harideva precinct, then remember Mahāprabhu’s bathing and meal here. Visit #20–23 as distinct but closely connected sacred places.'
