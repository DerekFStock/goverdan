  - place_id: place.govardhan-town
    category: Sacred pilgrimage town and Govardhana-grāma
    summary: Govardhan Town represents the sacred settlement gathered around Girirāja and the Mānasī-gaṅgā and Harideva pilgrimage precinct. This numbered place intentionally represents a town and pilgrimage area rather than one shrine or sacred object.
    why_sacred: Caitanya-caritāmṛta, Madhya 18.17 explicitly calls the settlement Govardhana-grāma when Mahāprabhu enters the village to see Harideva. Rūpa Gosvāmī’s Mathurā-māhātmya presents Govardhana as an exalted sacred region and pilgrimage setting. The modern settlement continues to hold a dense network of temples, sacred waters, and parikramā activity.
    what_to_see:
