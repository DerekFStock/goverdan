  - place_id: place.gulala-kunda
    category: Rādhā-Kṛṣṇa Holī līlā kuṇḍa
    summary: 'Bhakti-ratnākara 5.799–802 makes Gulāla-kuṇḍa an unusually well-described Holī site: after Rādhā and Kṛṣṇa play, a sakhī secretly ties Their garments, and the resulting knot is woven into the early explanation of nearby Gāṅṭholī’s name. The text explicitly names Gulāla-kuṇḍa in the same sequence.'
    why_sacred: 'The early Gauḍīya account directly joins Rādhā-Kṛṣṇa Holī, phāgu colors, the playful garment knot, Gulāla-kuṇḍa, and Gāṅṭholī. Living pilgrimage remembers spring celebration and nearby Puṣṭimārga baithak traditions. Reports that the present water visibly turns red are living tradition, not a promised observation.'
    what_to_see:
      - Gulāla-kuṇḍa and its current ghāṭ or enclosure.
      - Nearby Vallabhācārya or Śrīnāthjī baithak places where currently identifiable and open.
      - The devotional setting of Holī observances and its relation to separate #65 Gāṅṭholī village.
    lila: 'Rādhā and Kṛṣṇa sit together after playing Holī. A sakhī secretly knots Their garments; when They rise, the knot is discovered, the sakhīs laugh, and the embarrassed Divine Couple become the center of more playful phāgu. Bhakti-ratnākara preserves this as the early pilgrimage explanation for Gāṅṭholī.'
    pilgrim_guidance: '#64 is the kuṇḍa; #65 is the wider village. Festival conditions may differ greatly from ordinary days. Do not throw colors on pilgrims, temple objects, or water outside an authorized local observance. Sacred bathing tradition is not a current water-safety guarantee; follow normal baithak and temple etiquette.'
    references:
      - id: reference.gulala-kunda.bhakti-ratnakara-5-799-802
        source_title: Bhakti-ratnākara
        locus: 5.799–802
        explanation: Direct Holī, garment-knot, Gāṅṭholī-name, and Gulāla-kuṇḍa narrative.
        quotation: A sakhī secretly tied Their garments together.
      - id: reference.gulala-kunda.entwistle
