  - place_id: place.jugal-kunda
    category: Sacred pastoral encampment kuṇḍa
    summary: Jugal-kuṇḍa is a secluded sacred pond remembered in pilgrimage tradition as a place where Nanda Mahārāja and the cowherd community camped during their movements through Vraja. The name is preserved without inventing a separate yugala-līlā unsupported by the current evidence.
    why_sacred: Traditional pilgrimage guides associate this kuṇḍa with a pastoral encampment of Nanda Mahārāja, Kṛṣṇa, and the cowherd community. Śrīmad-Bhāgavatam 10.11.21–30 narrates the community’s migration with its carts, herds, elders, women, and children; verse 28 vividly describes their departure. This is broad canonical migration context and does not name Jugal-kuṇḍa.
    what_to_see:
      - The small, secluded kuṇḍa set away from the main road.
      - The surrounding trees and fields that retain a pastoral character.
      - The relationship of the pond to the nearby Gvāla-pokhara and Sant Nivas landscape, without merging their identities.
    lila: Remember the moving pastoral world of Vraja here—the cowherd community traveling together with carts and cattle under Nanda Mahārāja’s care. The specific association of their camp with this pond belongs to pilgrimage tradition.
    pilgrim_guidance: The kuṇḍa is small, secluded, and slightly off the main parikramā road. Approach attentively and ask locally when needed; the app does not assert unverified footpaths or a more precise arrival point than the approved coordinate.
    references:
