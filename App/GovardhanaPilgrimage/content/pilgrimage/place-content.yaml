  - place_id: place.punchari-lautha-baba-temple
    category: Pūñcharī cowherd-friend shrine and parikramā landmark
    summary: Pūñcharī kā Lauṭhā Bābā Temple is a beloved living shrine at the tail end of Govardhana. Braj parikramā tradition remembers Lauṭhā Bābā as a cowherd friend of Kṛṣṇa who remained in Vraja waiting for his beloved friend to return after Kṛṣṇa left for Mathurā. His waiting is a devotional image of steadfast friendship and separation.
    why_sacred: Garga-saṁhitā supports Pūñcharī’s sacred identity as Govardhana’s tail landscape but does not name Lauṭhā Bābā. Śrīmad-Bhāgavatam 10.39 provides the canonical Mathurā-departure background but does not identify Lauṭhā as a named cowherd or establish this shrine. His personal story and the shrine’s parikramā importance are preserved through living Braj tradition.
    what_to_see:
      - The small Lauṭhā Bābā shrine and deity as currently worshiped.
      - The main parikramā-road setting.
      - The visual transition into Govardhana’s Pūñcharī or tail landscape.
      - 'The relation to the distinct nearby #48 Nava-kuṇḍa and #49 Apsarā-kuṇḍa.'
    lila: Braj tradition remembers Lauṭhā Bābā as one of Kṛṣṇa’s cowherd friends. When Kṛṣṇa left Vraja for Mathurā, Lauṭhā remained at Pūñcharī waiting for His return; the long wait expresses unbroken sakhya and viraha. This is a living Braj pilgrimage tradition, and the project has not verified Lauṭhā Bābā as a named character in the canonical departure narrative.
    pilgrim_guidance: 'This living devotional shrine lies directly in the Pūñcharī parikramā landscape. Many local pilgrims treat its darśana as important, but present custom is not turned into mandatory śāstric law. Keep #50 distinct from #48 and #49 even though all three belong to the compact tail cluster.'
