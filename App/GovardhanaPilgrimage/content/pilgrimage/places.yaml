    ascii_name: Uddhava Temple
    alternate_names:
      - Uddhav Temple
    latitude: 27.51141
    longitude: 77.47705
    coordinate_status: PROBABLE
    coordinate_confidence: HIGH
    coordinate_accuracy_meters:
    verification_notes: This is specifically the Uddhava-associated temple in the Kusuma-sarovara cluster represented by map #6, not Uddhava-kuṇḍa, Uddhav Kund, the Uddhava Bihari complex, or future map place #69; field verification remains outstanding.
    provenance:
      - source_type: PILGRIMAGE_GUIDE
        description: Traditional pilgrimage descriptions identify an Uddhava-associated temple in the immediate Kusuma-sarovara area.
      - source_type: MODERN_MAP
        description: Current mapping identifies Uddhav Temple at location code GF6G+HR7, consistent with map-place #6.
      - source_type: PROJECT_RESEARCH
        description: Approved Task 016 research decision preserving the explicit distinction from the separate Uddhava-kuṇḍa and future map #69.
    content_destination:
