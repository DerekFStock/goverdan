  storySectionId: story.radhakunda.manifestation
  contentBlockId: rk-manifestation-block-03-radha-manifests-pond
  scope: block
  note_type: omission_control
  text: Use 'with their own hands.' Do not add bangles as digging implements unless a separately checked source
    is explicitly introduced.
- id: research-note.rk.manifestation.dividing-bank
  storySectionId: story.radhakunda.manifestation
