block_anchors:
- id: rk-manifestation-block-01-dharma-challenge
  order: 1
  movement_id: movement.rkma.playful-dharma-challenge
  intended_block_type: paragraph
  development_summary: Rādhā and the gopīs frame Ariṣṭa's bull-form killing as a playful dharma challenge and require
    Kṛṣṇa to bathe in all holy waters.
  prose_status: DRAFTED_V0_1
  citation_group_id: citation-group.rk.manifestation.01
- id: rk-manifestation-block-02-krsna-manifests-pond
  order: 2
  movement_id: movement.rkma.krsna-manifests-pond
  intended_block_type: paragraph
  development_summary: Kṛṣṇa strikes the earth, summons the tīrthas, has them identify themselves, bathes, and presents
    His pond as containing the holy places.
  prose_status: DRAFTED_V0_1
  citation_group_id: citation-group.rk.manifestation.02
- id: rk-manifestation-block-03-radha-manifests-pond
  order: 3
  movement_id: movement.rkma.radha-manifests-pond
  intended_block_type: paragraph
  development_summary: Rādhā and the sakhīs choose Ariṣṭa's hoofprint depression west of Kṛṣṇa's pond and excavate
    their own lake with their own hands; Rādhā refuses Kṛṣṇa-kuṇḍa water and proposes Mānasa-gaṅgā water.
  prose_status: DRAFTED_V0_1
  citation_group_id: citation-group.rk.manifestation.03
- id: rk-manifestation-block-04-tirthas-petition
  order: 4
  movement_id: movement.rkma.tirthas-petition
  intended_block_type: paragraph
  development_summary: At Kṛṣṇa's indication, the personified tīrthas approach Rādhā, praise Her, ask what boon
    they may receive, and request permission to enter Her lake; Rādhā grants consent.
  prose_status: DRAFTED_V0_1
  citation_group_id: citation-group.rk.manifestation.04
- id: rk-manifestation-block-05-waters-join
  order: 5
  movement_id: movement.rkma.waters-join
  intended_block_type: paragraph
  development_summary: After receiving Rādhā's grace, the tīrthas in Kṛṣṇa-kuṇḍa break through the dividing bank
    and fill Rādhā-kuṇḍa with their waters.
  prose_status: DRAFTED_V0_1
  citation_group_id: citation-group.rk.manifestation.05
- id: rk-manifestation-block-06-krsna-declaration
  order: 6
  movement_id: movement.rkma.krsna-declaration
  intended_block_type: paragraph
  development_summary: Kṛṣṇa declares Rādhā's kuṇḍa more glorious than His own, says He will bathe and sport there
    daily, and loves it as He loves Rādhā.
  prose_status: DRAFTED_V0_1
  citation_group_id: citation-group.rk.manifestation.06
- id: rk-manifestation-block-07-radha-declaration
  order: 7
  movement_id: movement.rkma.radha-declaration
  intended_block_type: paragraph
  development_summary: Rādhā reciprocally declares Her daily bathing with the sakhīs in the pond of Ariṣṭa's subduer
    and blesses those devoted to it.
  prose_status: DRAFTED_V0_1
  citation_group_id: citation-group.rk.manifestation.07
- id: rk-manifestation-block-08-rasa-night
  order: 8
  movement_id: movement.rkma.rasa
  intended_block_type: paragraph
  development_summary: That same night Rādhā and Kṛṣṇa celebrate rāsa, spreading the glory of the kuṇḍas through
    the three worlds.
  prose_status: DRAFTED_V0_1
  citation_group_id: citation-group.rk.manifestation.08
