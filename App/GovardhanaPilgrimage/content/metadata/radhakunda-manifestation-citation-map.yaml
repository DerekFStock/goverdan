research_notes:
- id: research-note.rk.manifestation.provenance
  storySectionId: story.radhakunda.manifestation
  scope: section
  note_type: source_critical
  text: The twenty-verse unit is treated as a Purāṇic account preserved/transmitted by Viśvanātha Cakravartī in
    connection with Śrīmad-Bhāgavatam 10.36.16. The exact underlying Purāṇa and recension remain unresolved; the
    Story must not assign a named Purāṇa without direct verification.
- id: research-note.rk.manifestation.naming
  storySectionId: story.radhakunda.manifestation
  scope: section
  note_type: terminology_control
  text: Preserve source-specific Kṛṣṇa-kuṇḍa / Ariṣṭa-mardana-saras terminology in quoted or closely source-bound
    prose; do not silently retroject the later/common name Śyāma-kuṇḍa into the early transmitted wording.
