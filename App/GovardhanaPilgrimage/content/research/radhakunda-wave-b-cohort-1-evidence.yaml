  - research_id: RK-22
    name: Mahāprabhu baithak / Tamala Tala
    source_ids: [INVENTORY, TRIAGE, OSM_NEIGHBORHOOD, HOLY_DHAM, NATHDWARA_NAMESAKE]
    claims:
      present_physical_identity: Guide identifies a Śyāma-kuṇḍa-bank platform with tamāla tree and enshrined footprints as Caitanya Mahāprabhu's Baithaka/Tamala Tala; a separate temple or enclosing compound is not resolved.
      present_access: Guide follows a perimeter path, but no controlled entrance, current public-access rule, or safe arrival point was found.
      historical_identification: Caitanya-caritāmṛta Madhya 18 places Mahāprabhu at the twin kuṇḍas; it does not identify a present platform, tree, or building footprint.
      textual_or_lila_significance: Later pilgrimage localization associates this bank-side platform with Mahāprabhu's recognition of the kuṇḍas.
      devotional_practice: Footprints and tree are described as present shrine features; botanical and historical continuity are not established.
    geometry_negative_finding: No controlled platform, compound boundary, doorway, or tree feature was found in inspected geodata.
    recommended_representation: One parent baithak site, with platform/tree/footprints/temple treated as possible children or descriptive parts after field reconciliation; no separate pins by name alone.
    navigation_recommendation: NOT_ELIGIBLE
    relationships: 'Disambiguate Caitanya/Tamala Tala from the Vallabhācārya Mahāprabhuji Baithakji namesake at Rādhā-kuṇḍa.'
    decision: HOLD_IDENTITY_RECONCILIATION
    required_field_observations: [Photograph exact sign and wide platform/tree/temple context., Record which named feature contains which and any operator name., GPS at a safe public approach or actual doorway., Record access hours or barriers., Do not claim tree age or continuity from appearance.]
    production_acceptance_conditions: [Verify current Caitanya-specific identity and rule out namesake confusion., Establish one parent and child/descriptive relationships., Control a safe approach or entrance., Choose point versus compound polygon only from surveyed physical evidence.]
