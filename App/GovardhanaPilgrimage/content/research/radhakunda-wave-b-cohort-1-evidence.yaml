records:
  - research_id: RK-03
    name: Saṅgama crossing
    source_ids: [INVENTORY, TRIAGE, OSM_NEIGHBORHOOD, HOLY_DHAM]
    claims:
      present_physical_identity: Guide describes a stone path with water-mixing slits between the two separate kuṇḍas; bridge versus causeway versus walkway construction is unconfirmed.
      present_access: A pedestrian approach is described, but present public passage, safety, stairs, and boundaries have not been verified.
      historical_identification: No evidence proves continuity of the present construction with an earlier setu.
      textual_or_lila_significance: Govinda-līlāmṛta 7.6 concerns a textual junction and ornate setu, not a survey of present construction.
      devotional_practice: Pilgrimage guide recognizes the meeting of the waters; no current access practice was independently verified.
    geometry_negative_finding: No source identifies a controlled crossing line or entrance; unnamed OSM highway ways cannot be assigned to RK-03.
    recommended_representation: CROSSING_LINE_IF_SURVEYED; otherwise relationship between distinct water polygons, without merging them.
    navigation_recommendation: NOT_ELIGIBLE
    relationships: 'RK-GH-07 is the shared Saṅgama Ghāṭ/bank-approach question, not a second automatic pin; relate both water polygons without combining their rings.'
    decision: FIELD_VERIFICATION_REQUIRED
    required_field_observations: [Photograph both ends and full crossing from safe public ground., Record sign text and whether this is one crossing or an adjacent named ghāṭ., Record GPS only at safe publicly accessible ends., Confirm current pedestrian access and steps or barriers.]
    production_acceptance_conditions: [Control the physical crossing geometry and source revision., Confirm publicly safe passage or a safe approach point., Resolve RK-GH-07 as same feature, adjacent child, or distinct tradition., Keep Rādhā and Śyāma water polygons distinct.]
