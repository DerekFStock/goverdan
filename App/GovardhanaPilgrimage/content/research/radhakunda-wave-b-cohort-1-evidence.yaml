      present_access: No controlled public doorway, opening information, or photography policy was found.
      historical_identification: The discovery and placement account is a living tradition, not independent proof of object provenance or exact older footprint.
      textual_or_lila_significance: Girirāja-jihvā identification belongs to shrine tradition; it does not locate a point within the building.
      devotional_practice: Account says the śilā is still worshipped and visible; current practice requires confirmation.
    geometry_negative_finding: No controlled shrine building, doorway, or sacred-object coordinate in inspected sources; Gopī-kūpa and similarly named Govardhana-śilās cannot substitute.
    recommended_representation: Public temple entrance point if independently controlled; sacred object as description or child inside compound, not a guessed point.
    navigation_recommendation: NOT_ELIGIBLE
    relationships: 'Verify exact temple/compound identity and relation to Govindadeva; keep Gopī-kūpa and other Govardhana-śilā sites separate.'
    decision: HOLD_ACCESS_VERIFICATION
    required_field_observations: [Photograph temple and sign from public way., Identify exact public doorway and GPS there., Record whether object is inside a larger compound., Ask about public opening and photography restrictions without entering restricted areas.]
