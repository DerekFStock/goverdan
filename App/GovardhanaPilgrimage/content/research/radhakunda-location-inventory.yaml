  runtime_compilation: false
  public_numbering: none
  source_controls:
    - 01_Radhakunda_Research_Dossier_v0.4.docx
    - RK-02_Radhakunda_Nitya-lila_and_Sacred_Geography_Research_Ledger_v0.2.docx
