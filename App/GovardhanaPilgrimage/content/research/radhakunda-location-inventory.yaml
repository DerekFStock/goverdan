    - https://www.brajrasik.org/photo/5dff219fc40a27006408fe06/checkout-map-of-radha-kund-goverdhan-to-visit-important-leela-sthalis
    - vraja_mandala_parikrama_2ed.pdf
  physical_planning_note: >-
    The Braj Development Plan treats the twin-kuṇḍa precinct as linked physical heritage:
    heritage-walk and pedestrian development, historic linkage among Rādhā-kuṇḍa,
    Śyāma-kuṇḍa, Lalitā-kuṇḍa and Mohana-kuṇḍa, Lalitā conservation, Mohana
    revitalization and Śyāma rejuvenation. This is present planning geography,
    not evidence for nitya-līlā locations or historical building continuity.
  note: Research IDs and proposed IDs are not public map numbers or compiled runtime identities.

