schema_version: 1
manifest:
  id: manifest.radhakunda-mvp.development-v1
  title: Rādhā-kuṇḍa MVP Development Content Manifest
  version: 0.3.0
  mode: DEVELOPMENT
  target_path: content/manifests/radhakunda-mvp-development-manifest.yaml
  entry_story_section_id: story.radhakunda.manifestation
  development_ready: true
  release_ready: false
  purpose: Authoritative development content package for the first real Story → Citation → Source vertical slice;
    preserved during Tasks 001–009 and installed only under explicitly approved CODEX_TASK_010.
  current_authorized_task: TASK_SEQUENCE_CONTROLLED_BY_USER
  real_content_integration_status: AUTHORIZED_ONLY_IN_CODEX_TASK_010
